type: Group
instructions:
  - type: Group
    instructions:
      - !include "{{pyside/pyside-setup}}/execute_android_instructions.yaml"
    enable_if:
      condition: property
      property: target.os
      equals_value: Android
  - type: Group
    instructions:
      - !include "{{pyside/pyside-setup}}/execute_desktop_instructions.yaml"
    enable_if:
        condition: and
        conditions:
        - condition: property
          property: host.compiler
          not_equals_value: Mingw
        - condition: property
          property: target.os
          not_equals_value: Android
        - condition: property
          property: features
          not_contains_value: PysideAxivion
        - condition: property
          property: features
          not_contains_value: DocsGenerationV2
  - type: Group
    instructions:
      - !include "{{pyside/pyside-setup}}/execute_axivion_scan.yaml"
    enable_if:
      condition: property
      property: features
      contains_value: PysideAxivion
